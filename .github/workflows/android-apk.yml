name: Build Android APK

# Build a fresh APK whenever the app or its library changes.
#
# This workflow used to run only for version tags. That let the web app move ahead while the
# downloadable Android build stayed on an old catalog and an old home screen. It now also runs
# for app changes on the main branches; catalog-only updates do not require a new APK.
on:
  push:
    branches: ["main", "master", "arena/59c5f4cf-re-port"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      # Regenerate the bundled library from the committed source data, so the APK can never
      # silently ship an older generated catalog than the repository contains.
      - name: Rebuild catalog from source data
        run: |
          node scripts/import-catalog-lists.mjs
          node scripts/build-data.mjs

      - name: Build the web app
        env:
          # Installed APKs read the catalog published from this repository, not only the
          # snapshot copied into the APK, so library updates arrive without a new APK.
          VITE_REMOTE_CATALOG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/public/catalog.json
          VITE_APP_BUILD_ID: ${{ github.sha }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
        run: npm run build

      - name: Verify the build is not stale
        run: node scripts/verify-build.mjs

      - name: Check startup, page transitions and back handling
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          if node scripts/test-app-transitions.mjs > "$RUNNER_TEMP/app-test.log" 2>&1; then
            cat "$RUNNER_TEMP/app-test.log"
          else
            cat "$RUNNER_TEMP/app-test.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-8000); console.log("::error::"+s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))' "$RUNNER_TEMP/app-test.log"
            exit 1
          fi

      - name: Check cover-flow gestures and layout
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          if node scripts/test-cover-flow.mjs > "$RUNNER_TEMP/cover-flow.log" 2>&1; then
            cat "$RUNNER_TEMP/cover-flow.log"
          else
            cat "$RUNNER_TEMP/cover-flow.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-8000); console.log("::error::"+s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))' "$RUNNER_TEMP/cover-flow.log"
            exit 1
          fi

      - name: Create the Android project
        run: npx cap add android

      - name: Install prepared Android icons
        run: cp -a assets/android-res/. android/app/src/main/res/

      - name: Configure Android system DayNight theme
        run: node scripts/configure-android-theme.mjs

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Verify Android assets contain the current library
        run: |
          test -f android/app/src/main/assets/public/catalog.json
          node -e "const c=require('./android/app/src/main/assets/public/catalog.json'); if (c.androidPolicy !== 1 || (c.stats?.games||0) < 200 || (c.stats?.ports||0) < 200 || c.games.some(g => !g.ports?.length || g.ports.some(p => !p.androidEvidence))) { console.error(c.stats); process.exit(1); } console.log('Android catalog:', c.stats.games, 'games,', c.stats.ports, 'ports,', c.generated, c.revision);"

      # The user requested the debug build variant; the downloadable filename is simply RePort.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK download
        env:
          REF_NAME: ${{ github.ref_name }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "RePort-${REF_NAME//\//-}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RePort-apk-${{ github.run_number }}
          path: RePort-*.apk
          if-no-files-found: error
          retention-days: 90
