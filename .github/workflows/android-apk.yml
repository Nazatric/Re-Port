name: Build Android APK

on:
  push:
    branches: ["main", "master", "arena/59c5f4cf-re-port"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled catalog
        run: |
          python3 - <<'PY'
          import json
          with open('src/data/catalog.json', encoding='utf-8') as f: c = json.load(f)
          games = c['games']
          assert len(games) >= 2000 and sum(len(g['ports']) for g in games) >= 3000
          assert len({g['id'] for g in games}) == len(games)
          assert c['platforms'] and c['collections'] and c['sources']
          print(f"Bundling {len(games)} entries and {sum(len(g['ports']) for g in games)} ports, catalog {c['revision']}")
          PY
      - name: Test and build native Android APK
        working-directory: native
        run: |
          if ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain > "$RUNNER_TEMP/native-build.log" 2>&1; then
            cat "$RUNNER_TEMP/native-build.log"
          else
            cat "$RUNNER_TEMP/native-build.log"
            python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-24000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/native-build.log"
            exit 1
          fi
      - name: Verify APK includes the catalog and no WebView bridge
        run: |
          python3 - <<'PY'
          import zipfile,json,hashlib
          path='native/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as z:
              asset=z.read('assets/catalog.json')
              local=open('src/data/catalog.json','rb').read()
              assert asset == local, 'APK catalog does not match the full committed catalog'
              assert not any('capacitor' in n.lower() for n in z.namelist()), 'Unexpected Capacitor dependency in APK'
              c=json.loads(asset)
              print(f"APK contains {len(c['games'])} catalog entries and {sum(len(g['ports']) for g in c['games'])} ports")
          PY
      - name: Prepare APK download
        env:
          REF_NAME: ${{ github.ref_name }}
        run: cp native/app/build/outputs/apk/debug/app-debug.apk "RePort-${REF_NAME//\//-}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RePort-apk-${{ github.run_number }}
          path: RePort-*.apk
          if-no-files-found: error
          retention-days: 90
