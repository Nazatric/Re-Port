name: Build Android APK

# The session branch and version tags build a signed release APK.
on:
  push:
    branches: ["arena/59c5f4cf-re-port"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Release signing is not configured. Add the four signing secrets described in docs/android-release.md.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      # Capacitor packages this interface inside the Android app; no website is deployed.
      - name: Build Android interface
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Install prepared Android icons and splash screens
        run: cp -a assets/android-res/. android/app/src/main/res/

      - name: Configure Android system DayNight theme
        run: node scripts/configure-android-theme.mjs

      - name: Sync interface into Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign and verify release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/re-port-release.jks"
          chmod 600 "$RUNNER_TEMP/re-port-release.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/re-port-aligned.apk"
          APK="RePort-${REF_NAME//\//-}.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/re-port-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$RUNNER_TEMP/re-port-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/re-port-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: RePort-release-apk
          path: RePort-*.apk
          if-no-files-found: error

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RePort-*.apk
