name: Native Android smoke test

on:
  push:
    branches: ["arena/59c5f4cf-re-port"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native APK
        working-directory: native
        run: |
          if ./gradlew assembleDebug --no-daemon --console=plain > "$RUNNER_TEMP/native-smoke-build.log" 2>&1; then
            cat "$RUNNER_TEMP/native-smoke-build.log"
          else
            cat "$RUNNER_TEMP/native-smoke-build.log"
            python3 -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); errors=[x for x in lines if x.startswith("e: ") or "FAILURE:" in x or "Execution failed" in x]; [print("::error::"+s.replace("%","%25")) for s in (errors or lines[-20:])]' "$RUNNER_TEMP/native-smoke-build.log"
            exit 1
          fi
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and exercise navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -o pipefail
            python3 native/smoke.py 2>&1 | tee "$RUNNER_TEMP/native-smoke.log"
