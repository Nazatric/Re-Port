name: Build Android APK

on:
  push:
    branches: ["arena/551825be-re-port", "main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (for example v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and check web app
        run: |
          npm ci
          npm run typecheck
          node scripts/test-release-links.mjs
          npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check web and Android bridge flows
        run: |
          node scripts/smoke-web.mjs
          node scripts/smoke-profile-performance.mjs
          node scripts/smoke-overlays.mjs
      - name: Prepare Capacitor Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - name: Build universal debug APK
        working-directory: android
        run: bash ../scripts/build-android.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RePort-Capacitor-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RePort-Capacitor-Android-debug
          path: release-apk
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists'; exit 1; fi
          mv release-apk/app-debug.apk release-apk/Re-Port.apk
          sed "s/v1.0.0/$RELEASE_TAG/g" scripts/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release-apk/Re-Port.apk --target "$GITHUB_SHA" --title "Re:Port $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
