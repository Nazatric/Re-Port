name: Build Android APK

on:
  push:
    branches: ["arena/551825be-re-port", "arena/dcbf2003-re-port", "main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (for example v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

# A newer push cancels the older run for the same branch, so stale builds stop using runner minutes.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # Optional release signing. When these secrets are not set, only the debug APK is built.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and check web app
        run: |
          npm ci
      - name: Restore artwork cache
        uses: actions/cache@v4
        with:
          path: |
            .art-cache
            .art-out
          key: artwork-${{ github.run_id }}
          restore-keys: |
            artwork-
      - name: Build artwork bundle (IGDB, SteamGridDB, Steam CDN)
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAMGRIDDB_KEY: ${{ secrets.STEAMGRIDDB_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-art-bundle.mjs --if-stale
      - name: Publish artwork to release assets (kept out of the APK)
        continue-on-error: true
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-art.mjs
      - name: Check web app
        run: |
          npm run typecheck
          node scripts/test-release-links.mjs
          npm run build
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version rather than the whole lockfile, so unrelated lockfile changes
          # (such as the version bump) keep the cached browser. restore-keys reuses any earlier browser.
          key: playwright-chromium-${{ runner.os }}-pw-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-pw-
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: |
          # Only the browser is installed. The runner already ships the Chromium system libraries
          # (libnss3, libgbm1, libatk, ...). `install-deps` also fetches fonts from Ubuntu apt mirrors,
          # and those mirrors do not resolve from this runner image, so it is skipped.
          # Playwright skips the download when the cached browser is already present.
          for attempt in 1 2 3; do
            npx playwright install chromium && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 20
          done
      - name: Check web and Android bridge flows
        run: |
          node scripts/run-smoke.mjs
          node scripts/measure-browse-scroll.mjs
      - name: Prepare Capacitor Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - name: Build universal debug APK
        working-directory: android
        run: bash ../scripts/build-android.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RePort-Capacitor-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RePort-Capacitor-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  android-e2e:
    # Runs the Maestro flows on an emulator against the debug APK built above.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RePort-Capacitor-Android-debug
          path: apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            export PATH="$HOME/.maestro/bin:$PATH"
            set +e
            maestro test maestro/ --format junit --output maestro-report.xml --test-output-dir maestro-out
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Device log (last 400 lines)"
              adb logcat -d -t 400 | tail -400
              echo "::endgroup::"
            fi
            exit "$status"
      - name: Upload Maestro report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            maestro-out/
          if-no-files-found: warn

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RePort-Capacitor-Android-debug
          path: release-apk
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists'; exit 1; fi
          mv release-apk/app-debug.apk release-apk/Re-Port.apk
          sed "s/v1.0.0/$RELEASE_TAG/g" scripts/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release-apk/Re-Port.apk --target "$GITHUB_SHA" --title "Re:Port $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
