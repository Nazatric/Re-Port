name: Build catalog artwork

# Builds src/data/enrichment.json from keyless public sources (Steam store and CDN, Wikidata,
# libretro-thumbnails, Wikipedia). No API keys are used or needed. The result is committed to this
# branch and bundled into the next APK.
on:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
  workflow_dispatch:
  push:
    branches: ["arena/dcbf2003-re-port"]
    paths: ["scripts/build-artwork.mjs", "scripts/artwork/**"]

permissions:
  contents: write

concurrency:
  group: artwork-${{ github.ref }}
  cancel-in-progress: true   # a newer run replaces a stale one

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build artwork and details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-artwork.mjs --workers 8
      - name: Commit refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/enrichment.json
          if git diff --cached --quiet; then
            echo "No artwork changes."
          else
            git commit -m "Build catalog artwork and details (keyless sources)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
