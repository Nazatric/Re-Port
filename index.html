<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b4fb3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Re:Port is a library of unofficial native Android ports, recompilations and engine rebuilds of PC and console games, with direct links to every release." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <title>Re:Port - Unofficial Android Port Library</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('portdeck.settings.v1') || '{}');
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved.theme === 'lime' || saved.theme === 'graphite' || saved.theme === 'azure'
          ? saved.theme
          : dark ? 'graphite' : 'azure';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'graphite' ? '#1b1e22' : theme === 'lime' ? '#2f7d12' : '#0b4fb3';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'graphite' : 'azure';
      }
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #101a1e; }
      .boot-screen {
        min-height: 100dvh; display: grid; place-content: center; justify-items: center;
        gap: 16px; color: #d4edf0; font: 600 13px system-ui, sans-serif;
        letter-spacing: .18em; text-transform: uppercase;
        background: radial-gradient(ellipse at 50% 25%, #234a50, #101a1e 70%);
      }
      .boot-screen img { width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 10px 25px #0008); }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status" aria-label="Opening Re:Port"><img src="./header-logo.png" alt="" /><span>Re:Port</span></div></div>
    <noscript>Re:Port needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
