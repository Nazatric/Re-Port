# Opens the app on a clean install, searches the catalog for Doom and opens its detail page.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Browse"
    timeout: 60000
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn: "Games, port projects.*"
- inputText: "doom"
- hideKeyboard
- extendedWaitUntil:
    visible: "Doom"
    timeout: 30000
- tapOn: "Doom"
- extendedWaitUntil:
    visible: "(?i).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- takeScreenshot: detail-open
