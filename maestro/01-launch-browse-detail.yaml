# Opens the app on a clean install, searches the catalog and opens a game detail page.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- assertVisible: "Browse"
- tapOn: "Browse"
- tapOn: "Games, port projects.*"
- inputText: "doom"
- hideKeyboard
- tapOn: "Doom.*"
- assertVisible: "(?i).*port requirements.*"
- takeScreenshot: detail-open
