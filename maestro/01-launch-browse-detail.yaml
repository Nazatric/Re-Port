# Opens the app on a clean install, opens Browse and opens the first game card, then checks the detail page.
# Cards are tapped by their accessibility label ("Open <title>"), so the shuffled browse order does not matter.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Browse"
    timeout: 60000
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn: "Open (?!filters|sort).*"
- extendedWaitUntil:
    visible: "(?i).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- takeScreenshot: detail-open
