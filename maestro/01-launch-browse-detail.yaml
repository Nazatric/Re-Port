# Opens the app on a clean install, opens Browse and opens the first game card, then checks the detail page.
# Cards are chosen by position, not by title, because the browse order is shuffled on every visit.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Browse"
    timeout: 60000
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn:
    point: "30%,40%"
- extendedWaitUntil:
    visible: "(?i).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- takeScreenshot: detail-open
