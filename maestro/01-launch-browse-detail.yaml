# Opens the app on a clean install, searches the catalog for Thief II and opens its detail page.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Browse"
    timeout: 60000
- tapOn: "Browse"
- waitForAnimationToEnd
# Focus the search box: try the placeholder, then any old query. Both are optional so a miss does not abort the flow.
- tapOn:
    text: "Games, port projects.*"
    optional: true
- tapOn:
    text: "thief ii"
    optional: true
- eraseText: 40
- inputText: "thief ii"
- hideKeyboard
# The first result card sits at about 26% across and 47% down (its bounds on a 1080x2400 emulator). Text matching
# did not find the card's label, so tap its centre by position.
- tapOn:
    point: "26%,47%"
- extendedWaitUntil:
    visible: "(?is).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- takeScreenshot: detail-open
