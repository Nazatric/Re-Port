# Opens the app on a clean install, searches the catalog for Thief II and opens its detail page.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Browse"
    timeout: 60000
- tapOn: "Browse"
- waitForAnimationToEnd
# The search text can survive between launches, so tap the box whether it shows the placeholder or old text, then clear it.
- tapOn: "(Games, port projects.*|thief ii)"
- eraseText: 40
- inputText: "thief ii"
- hideKeyboard
- extendedWaitUntil:
    visible: "Thief II: The Metal Age.*"
    timeout: 30000
- tapOn: "Thief II: The Metal Age.*"
- extendedWaitUntil:
    visible: "(?i).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- takeScreenshot: detail-open
