# Moves between the bottom tabs, opens a game and returns with the Android back button.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 60000
- tapOn: "Library"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn: "Open (?!filters|sort).*"
- extendedWaitUntil:
    visible: "(?i).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Browse"
    timeout: 15000
- takeScreenshot: back-to-browse
