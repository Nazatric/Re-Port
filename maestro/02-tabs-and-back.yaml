# Moves between the bottom tabs, opens a game and returns with the Android back button.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 60000
- tapOn: "Library"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn:
    point: "30%,40%"
- extendedWaitUntil:
    visible: "(?i).*port requirements.*"
    timeout: 30000
- back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Browse"
    timeout: 15000
- takeScreenshot: back-to-browse
