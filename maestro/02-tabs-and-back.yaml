# Moves between the bottom tabs, opens a game from search (Thief II) and returns with the Android back button.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 60000
- tapOn: "Library"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd
- tapOn: "Browse"
- waitForAnimationToEnd
# Focus the search box: try the placeholder, then any old query. Both are optional so a miss does not abort the flow.
- tapOn:
    text: "Games, port projects.*"
    optional: true
- tapOn:
    text: "thief ii"
    optional: true
- eraseText: 40
- inputText: "thief ii"
- hideKeyboard
# tapOn waits for the card itself; a separate visibility check fails while the keyboard still covers the list.
- tapOn:
    text: "(?s).*Thief II: The Metal Age.*"
    index: 0
- extendedWaitUntil:
    visible: "(?is).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Browse"
    timeout: 15000
- takeScreenshot: back-to-browse
