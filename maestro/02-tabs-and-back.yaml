# Moves between the bottom tabs, opens a game from search (Thief II) and returns with the Android back button.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Library"
    timeout: 60000
- tapOn: "Library"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn: "Games, port projects.*"
- inputText: "thief ii"
- hideKeyboard
- extendedWaitUntil:
    visible: "Thief II: The Metal Age.*"
    timeout: 30000
- tapOn: "Thief II: The Metal Age.*"
- extendedWaitUntil:
    visible: "(?i).*(project page|release link|get latest apk|download source).*"
    timeout: 30000
- back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Browse"
    timeout: 15000
- takeScreenshot: back-to-browse
