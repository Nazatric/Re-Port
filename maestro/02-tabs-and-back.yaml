# Moves between the bottom tabs, opens a game and returns with the Android back button.
appId: dev.dandelion.store
---
- launchApp:
    clearState: true
- tapOn: "Library"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd
- tapOn: "Browse"
- waitForAnimationToEnd
- tapOn:
    point: "30%,40%"
- assertVisible: "(?i).*port requirements.*"
- back
- waitForAnimationToEnd
- assertVisible: "Browse"
- takeScreenshot: back-to-browse
