  <rect width="300" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-opacity="0.06" stroke-width="0.7">
    <line x1="0" y1="390" x2="300" y2="390"/><line x1="30" y1="385" x2="270" y2="385"/>
  </g>
