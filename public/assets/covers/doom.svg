      <stop offset="0" stop-color="#3b1710"/>
      <stop offset="0.5" stop-color="#24100a"/>
      <stop offset="1" stop-color="#110702"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28120a" stop-opacity="0"/>
      <stop offset="1" stop-color="#28120a" stop-opacity="0.35"/>
